<!DOCTYPE html>
<html>
<head>
    <title>Uncle Bro’s Coffee</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: rgb(73, 73, 73);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
             background-color: white;
            background-image: url("coffee.png");
            background-size: cover;
            background-position: top;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .login-box {
            width: 350px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .login-box h1 {
            margin-bottom: 10px;
            color: #4b2e1e;
        }

        .login-box p {
            margin-bottom: 25px;
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: black;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: gray;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login</h2>
        <p>Become a Member!</p>

        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">

        <a href="index.html"><button>Login</button></a>
    </div>

</body>
</html>
