<!DOCTYPE html>
<html>
<head>
   
    <title>Coffee Menu</title>

    <link rel="stylesheet" href="style.css">
</head>

    <style>
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: whitesmoke;
            color: black;
            
        }


        .menu {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .coffee {
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
             box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
           
        }

        .coffee img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
           
        }

        .coffee h2 {
            margin: 10px 0 5px;
        }

        

        .price {
            font-weight: bold;
            font-size: 18px;
        }



    .coffee button {
    margin-top: 12px;
    padding: 10px 25px;
    background-color: #3b281c;
    color: white;
    border: none;
    cursor: pointer;
     box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

.coffee button:hover {
    background-color: #3b281c;
    color: black;
    transform: scale(1.10);
}

.back-button {
    display: inline-block;
    padding: 10px 20px;
    background-color: black;
    color: white;
    text-decoration: none;
    margin: 20px;
}

.back-button:hover {
    background-color: black;
    transform: scale(1.10);
     
}

    </style>
</head>

<body>


         <a href="index.html" class="back-button">← Back</a>

         <center><h2>Coffee To Go</h2></center>

    <div class="menu">

        <div class="coffee">
            <img src="Espresso.png" alt="Espresso">
            <h2>Espresso</h2>
            <div class="price">₱80</div>
             <a href="buy.html">
            <button>Buy Now</button>
            </a>
        </div>

        <div class="coffee">
            <img src="Americano.png" alt="Americano">
            <h2>Americano</h2>
            <div class="price">₱90</div>
            <a href="buy.html">
            <button>Buy Now</button>
            </a>

        </div>

        <div class="coffee">
            <img src="Caffe Latte.png" alt="Latte">
            <h2>Latte</h2>
            <div class="price">₱110</div>
              <a href="buy.html">
            <button>Buy Now</button>
            </a>
        </div>

        <div class="coffee">
            <img src="Cappuccino.png" alt="Cappuccino">
            <h2>Cappuccino</h2>
            <div class="price">₱110</div>
              <a href="buy.html">
            <button>Buy Now</button>
            </a>
        </div>

        <div class="coffee">
            <img src="Mocha.png" alt="Mocha">
            <h2>Mocha</h2>
            <div class="price">₱120</div>
              <a href="buy.html">
            <button>Buy Now</button>
            </a>
        </div>

        <div class="coffee">
            <img src="Cold Brew.png" alt="Cold Brew">
            <h2>Cold Brew</h2>
            <div class="price">₱120</div>
              <a href="buy.html">
            <button>Buy Now</button>
            </a>
        </div>

    </div>



</body>
</html>
